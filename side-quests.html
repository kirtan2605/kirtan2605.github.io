    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css" integrity="sha512-P5MgMn1jBN01asBgU0z60Qk4QxiXo86+wlFahKrsQf37c9cro517WzVSPPV1tDKzhku2iJ2FVgL67wG03SGnNA==" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="bg-light">
    <header data-site-header></header>
    <main class="container side-quests-page pb-5">
        <section class="side-quests-section" aria-labelledby="gaming-title">
            <div class="side-quests-heading">
                <h1 id="gaming-title">Gaming</h1>
                <p class="side-quests-discord"><i class="fab fa-discord" aria-hidden="true"></i><span class="sr-only">Discord username: </span><strong data-discord-username></strong></p>
            </div>
            <div class="side-quests-game-grid" data-games></div>
        </section>

        <section class="side-quests-section" aria-labelledby="highlights-title" data-highlights-section hidden>
            <h2 id="highlights-title">Moments worth sharing</h2>
            <div class="side-quests-gallery" data-highlights></div>
        </section>
    </main>
</body>
</html>
